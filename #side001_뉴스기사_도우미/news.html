<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>뉴스 기사 도우미</title>

</head>
<body>
  <h1>뉴스 기사 도우미</h1>
  <link rel="stylesheet" href="./style.css">
  <div class="row">
    <div class="topic-bar" id="topicBar"></div>
    <input id="fileInput" type="file" accept=".json,application/json" disabled />
    <div class="nav">
      <button id="btnPrev" disabled>&lt;</button>
      <button id="btnNext" disabled>&gt;</button>
    </div>
    <button id="btnParaphrase" disabled>선택 문장 쉽게 바꾸기</button>
    <span class="pill" id="status">토픽 선택</span>
  </div>

  <h3>기사</h3>
  <div id="articleMeta" class="meta-line"></div>
  <div id="article" class="article" contenteditable="false"></div>

  <h3>선택 문장 또는 직접 입력</h3>
  <textarea id="inputText" placeholder="드래그한 문장이 자동으로 들어오고, 직접 입력도 가능"></textarea>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>풀어 쓴 결과</h3>
      <div class="box" id="outputBox"></div>
      <div class="actions">
        <button id="btnCopy">복사</button>
        <button id="btnClose">닫기</button>
      </div>
    </div>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
